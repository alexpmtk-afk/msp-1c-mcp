name: Bitrix24 bridge standalone bootstrap checks
on:
  pull_request:
    paths:
      - 'integrations/msp-bitrix24-bridge/**'
      - '.github/workflows/bitrix24-bridge-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Safety contracts (offline)
        shell: pwsh
        run: python -m unittest discover -s integrations/msp-bitrix24-bridge/tests -p "test_*.py" -v
      - name: Windows PowerShell parse (native PS2 is separately gated)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem 'integrations/msp-bitrix24-bridge/bin' -Filter '*.ps1' | ForEach-Object {
            $source=[IO.File]::ReadAllText($_.FullName,[Text.Encoding]::UTF8)
            $errs=$null
            $null=[System.Management.Automation.PSParser]::Tokenize($source,[ref]$errs)
            if($errs -and $errs.Count -gt 0){foreach($parseErr in $errs){Write-Output ('PS_PARSE_DIAGNOSTIC='+$_.Name+'|'+$parseErr.Message+'|'+$parseErr.Token.StartLine)};throw ('PARSE_FAILED: '+$_.Name)}
            if(-not $source.StartsWith('#requires -version 2')){throw ('PS2_DECLARATION_MISSING: '+$_.Name)}
            Write-Output ('PARSE_PASS='+$_.Name)
          }
      - name: Pinned SHA256 portable source bytes, force LF
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@('bin/bridge.ps1','bin/install-system.ps1',
                   'bin/smoke-system.ps1','bin/enable-system.ps1',
                   'bin/status.ps1','bin/resume-system.ps1','bin/diagnose-runtime.ps1',
                   'bin/repair-file-acl.ps1','bin/inspect-customers-metadata.ps1',
                   'bin/inspect-customers-schema.ps1','bin/inspect-customers-counts.ps1',
                   'bin/inspect-customers-required-counts.ps1',
                   'bin/diagnose-customer-string-filters.ps1','bin/pilot-customers-local-10.ps1',
                   'bin/scan-customers-required-fields.ps1','bin/pilot-buyer-types-local-100.ps1',
                   'bin/count-buyer-classes.ps1','bin/scan-legal-required-fields.ps1',
                   'bin/preflight-srv-customer-store.ps1',
                   'bin/inventory-srv-sqlite-runtime.ps1',
                   'bin/pilot-create-sqlite-store.ps1',
                   'bin/audit-machine-owned-customer-chain.ps1',
                   'bin/smoke-customer-store-service.ps1','config/collector.ini',
                   'bin/install-machine-customer-store.ps1',
                   'config/bridge.ini')
          foreach($f in $files){
            $path=Join-Path 'integrations/msp-bitrix24-bridge' $f
            [byte[]]$bytes=[IO.File]::ReadAllBytes($path)
            if([Array]::IndexOf($bytes,[byte]13) -ge 0){
              throw ("CR_BYTE_IN_PINNED_FILE="+$f)
            }
            $sha=(Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            Write-Output "STAGE_HASH=$f|$sha"
            Write-Output "STAGE_BYTES=$f|$($bytes.Length)"
          }
          $sqlFile='integrations/msp-bitrix24-bridge/schema/customer-store.sql'
          Write-Output ('SCHEMA_SHA256='+(Get-FileHash -Algorithm SHA256 $sqlFile).Hash.ToLowerInvariant())
