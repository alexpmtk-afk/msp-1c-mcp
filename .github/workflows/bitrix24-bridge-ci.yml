name: Bitrix24 bridge standalone bootstrap checks
on:
  pull_request:
    paths:
      - 'integrations/msp-bitrix24-bridge/**'
      - '.github/workflows/bitrix24-bridge-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Safety contracts (offline)
        shell: pwsh
        run: python -m unittest discover -s integrations/msp-bitrix24-bridge/tests -p "test_*.py" -v
      - name: Windows PowerShell syntax (not native PS2 acceptance)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='integrations/msp-bitrix24-bridge/bin'
          Get-ChildItem $dir -Filter '*.ps1' | ForEach-Object {
            $source=[IO.File]::ReadAllText($_.FullName,[Text.Encoding]::UTF8)
            $errs=$null
            $null=[System.Management.Automation.PSParser]::Tokenize($source,[ref]$errs)
            if($errs -and $errs.Count -gt 0) {
              throw ('PARSE_FAILED: '+$_.Name)
            }
            if(-not $source.StartsWith('#requires -version 2')) {
              throw ('PS2_DECLARATION_MISSING: '+$_.Name)
            }
            Write-Output ('PARSE_PASS='+$_.Name)
          }
