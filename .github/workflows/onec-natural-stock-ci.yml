name: 1C Natural Stock Schema and Wire Offline Validation
on:
  pull_request:
    paths:
      - 'scripts/windows/onec-natural-stock-schema-preflight.ps1'
      - 'scripts/windows/onec-natural-stock-schema-runner.ps1'
      - 'scripts/windows/onec-natural-stock-schema-once.ps1'
      - 'src/msp_onec_mcp/natural_stock_contract.py'
      - 'src/msp_onec_mcp/natural_stock_resolution.py'
      - 'tests/test_onec_natural_stock_contract.py'
      - 'tests/test_onec_natural_stock_resolution.py'
      - '.github/workflows/onec-natural-stock-ci.yml'
permissions:
  contents: read
jobs:
  unicode-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Unicode article / warehouse transport and reject unsafe input
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<10'
          PYTHONPATH=src python -m pytest -q tests/test_onec_natural_stock_contract.py tests/test_onec_natural_stock_resolution.py tests/test_onec_stock_stdio.py
  windows-readonly-schema:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PS2 syntax and verify read-only OData schema boundaries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='scripts/windows/onec-natural-stock-schema-preflight.ps1'
          $bytes=[IO.File]::ReadAllBytes($path)
          if($bytes.Length -lt 5 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'UTF8_BOM_REQUIRED_FOR_PS2'
          }
          $script=[IO.File]::ReadAllText($path)
          if(-not $script.TrimStart([char]0xFEFF).StartsWith('#requires -version 2')) {
            throw 'PS2_GUARD_MISSING'
          }
          $errors=$null
          $null=[Management.Automation.PSParser]::Tokenize($script,[ref]$errors)
          if($errors -and $errors.Count -gt 0) { throw 'PS2_SYNTAX_INVALID' }
          foreach($required in @('S-1-5-19','MCP_OData_ReadOnly',
            '127.0.0.1:8085/NewBase/odata/standard.odata/',
            "Method='GET'",'AllowAutoRedirect=$false',
            'ProtectedData]::Unprotect','DtdProcessing','Prohibit',
            'MaxCharactersInDocument','EscapeDataString',
            'PropertyNames','warehouseCandidates',
            'articlePresent','EXAMPLE_ARTICLE_MATCHES',
            'RAW_NOMENCLATURE_AND_GUIDS_EXPORTED=NO','DATA_WRITES=NO')) {
            if(-not $script.Contains($required)) { throw ('MISSING_GUARD='+$required) }
          }
          foreach($bad in @('Invoke-Expression','Invoke-RestMethod','Start-Process',
            'RegisterTaskDefinition','New-ScheduledTask','Invoke-Command',
            'HttpListener','WebClient','POST','PUT','DELETE')) {
            if($script -cmatch ('\b'+[regex]::Escape($bad)+'\b')) {
              throw ('UNSAFE_ACTION='+$bad)
            }
          }
          $runnerPath='scripts/windows/onec-natural-stock-schema-runner.ps1'
          $oncePath='scripts/windows/onec-natural-stock-schema-once.ps1'
          foreach($file in @($runnerPath,$oncePath)) {
            $raw=[IO.File]::ReadAllBytes($file)
            if($raw.Length -lt 4 -or $raw[0] -ne 239 -or $raw[1] -ne 187 -or $raw[2] -ne 191) {
              throw ('UTF8_BOM_MISSING='+$file)
            }
            $code=[IO.File]::ReadAllText($file)
            $errors=$null
            $null=[Management.Automation.PSParser]::Tokenize($code,[ref]$errors)
            if($errors -and $errors.Count -gt 0) { throw ('PS2_PARSE_FAIL='+$file) }
            if(-not $code.TrimStart([char]0xFEFF).StartsWith('#requires -version 2')) {
              throw ('PS2_GUARD_MISSING='+$file)
            }
          }
          $runner=[IO.File]::ReadAllText($runnerPath)
          foreach($expected in @('S-1-5-19','natural-stock-schema-report.txt',
            'ONEC_NATURAL_STOCK_ONESHOT_RESULT','EXAMPLE_(ARTICLE|CODE)_MATCHES')) {
            if(-not $runner.Contains($expected)) { throw ('RUNNER_GUARD_MISSING='+$expected) }
          }
          $installer=[IO.File]::ReadAllText($oncePath)
          foreach($expected in @('MspOnecNaturalSchemaOnce','GetTask',
            'MspOnecHttpsAgentSystem','SYSTEM_TASK_CHANGED=NO',
            'Triggers.Count -ne 0','RegisterTaskDefinition',
            'STAGED_HASH_MISMATCH','ADMIN_REQUIRED','S-1-5-19',
            'DeleteTask($taskName,0)')) {
            if(-not $installer.Contains($expected)) { throw ('ONESHOT_GUARD_MISSING='+$expected) }
          }
          if($runner -match 'RegisterTaskDefinition|New-ScheduledTask|Invoke-Expression' -or
              $installer -match 'Start-ScheduledTask|Invoke-Expression|RegisterService') {
            throw 'ONE_SHOT_UNSAFE_OPERATION'
          }
          'ONEC_ONESHOT_PS2_STATIC=PASS'
          'ONEC_SCHEMA_PS2_STATIC=PASS'
          'NATIVE_SERVER_2008_R2_RUNTIME=NOT_TESTED'
          'LIVE_ODATA_ARTICLE_MATCH=NOT_TESTED'
