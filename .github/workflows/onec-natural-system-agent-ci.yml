name: 1C NewBase natural LocalService agent PS2 safety
on:
  pull_request:
    paths:
      - 'scripts/windows/onec-system-odata-natural.ps1'
      - 'scripts/windows/onec-system-probe-poll.ps1'
      - 'scripts/windows/onec-natural-live-smoke-runner.ps1'
      - 'scripts/windows/onec-natural-agent-cutover.ps1'
      - 'scripts/windows/onec-natural-agent-cutover-v2.ps1'
      - 'scripts/windows/onec-natural-diagnostic-helper.ps1'
      - 'scripts/windows/onec-natural-diagnostic-once.ps1'
      - 'scripts/windows/onec-legacy-json.ps1'
      - 'tests/windows/test_onec_legacy_json.ps1'
      - 'src/msp_onec_mcp/onec_stock_stdio.py'
      - 'src/msp_onec_mcp/natural_stock_vps.py'
      - 'tests/test_onec_natural_stock_vps.py'
      - 'tests/test_onec_stock_stdio.py'
      - '.github/workflows/onec-natural-system-agent-ci.yml'
permissions:
  contents: read
jobs:
  powershell-compat:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse PS2 scripts, bound allowed operations and block caller-controlled URLs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $helper='scripts/windows/onec-system-odata-natural.ps1'
          $poller='scripts/windows/onec-system-probe-poll.ps1'
          $smoke='scripts/windows/onec-natural-live-smoke-runner.ps1'
          $installer='scripts/windows/onec-natural-agent-cutover.ps1'
          $retry='scripts/windows/onec-natural-agent-cutover-v2.ps1'
          $diag='scripts/windows/onec-natural-diagnostic-once.ps1'
          $diagHelper='scripts/windows/onec-natural-diagnostic-helper.ps1'
          $jsonLibrary='scripts/windows/onec-legacy-json.ps1'
          $jsonTests='tests/windows/test_onec_legacy_json.ps1'
          foreach($path in @($helper,$poller,$smoke,$installer,$retry,$diag,$diagHelper,$jsonLibrary,$jsonTests)) {
            $bytes=[IO.File]::ReadAllBytes($path)
            if($bytes.Length -lt 6 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
              throw ('PS2_UTF8_BOM_REQUIRED='+$path)
            }
            $s=[IO.File]::ReadAllText($path,[Text.Encoding]::UTF8)
            if(-not $s.TrimStart([char]0xFEFF).StartsWith('#requires -version 2')) {
              throw ('PS2_GUARD_MISSING='+$path)
            }
            $errors=$null
            $null=[Management.Automation.PSParser]::Tokenize($s,[ref]$errors)
            if($errors -and $errors.Count -gt 0) {
              foreach($e in $errors) { Write-Output ('PARSE_ERROR='+$path+'|'+$e.Message) }
              throw ('PS2_PARSE_FAILED='+$path)
            }
            if($s -cmatch '(?<![A-Za-z])-(c?notin|c?in)\b') { throw ('PS3_OPERATOR_USED='+$path) }
            if($s -match 'Invoke-Expression|Invoke-Command|New-ScheduledTask|Start-Service|Restart-Service' -or
               ($path -notin @($installer,$retry,$diag) -and $s -match 'RegisterTaskDefinition')) {
              throw ('UNSAFE_HELPER_OPERATION='+$path)
            }
          }
          $h=[IO.File]::ReadAllText($helper,[Text.Encoding]::UTF8)
          foreach($required in @('S-1-5-19','MCP_OData_ReadOnly','ProtectedData]::Unprotect',
            '127.0.0.1:8085/NewBase/odata/standard.odata/',
            'Catalog_','Catalog_',
            'AccumulationRegister_','Balance(',
            "Method='GET'",'AllowAutoRedirect=$false',
            'ROW_PRESENT','NO_BALANCE_ROW','Description',
            'MspLegacyJson',
            'DeserializeObject','NAT_')) {
            if(-not $h.Contains($required)) { throw ('NATURAL_HELPER_GUARD_MISSING='+$required) }
          }
          $p=[IO.File]::ReadAllText($poller,[Text.Encoding]::UTF8)
          foreach($required in @('odata_stock_selected','odata_natural_stock',
            '/v1/agent/poll','/v1/agent/result','/v1/agent/natural-result',
            'NATURAL_RESULT_RECOVERED=YES','NATURAL_ACK_MISMATCH',
            'VERSION=ODATA_NATURAL_V1','VERSION=ODATA_SELECTED_V1')) {
            if(-not $p.Contains($required)) { throw ('NATURAL_POLLER_GUARD_MISSING='+$required) }
          }
          $accept=[IO.File]::ReadAllText($smoke,[Text.Encoding]::UTF8)
          foreach($needle in @('S-1-5-19','NAT_','OBSERVED_STOCK_6=PASS',
            'MISSING_BALANCE_QUALIFIED_ZERO=PASS',
            'natural-stock-live-smoke.txt','RESULT=PASS',
            'MspLegacyJson')) {
            if(-not $accept.Contains($needle)) { throw ('SMOKE_GUARD_MISSING='+$needle) }
          }
          $install=[IO.File]::ReadAllText($installer,[Text.Encoding]::UTF8)
          foreach($needle in @('MspOnecHttpsAgentSystem','MspOnecNaturalAcceptanceOnce',
            'SRV','ADMIN_REQUIRED','S-1-5-19','LocalService',
            'c7ad87b2d6ec41b0124a083d1bdf3305f5aee71f',
            '006a0b618575b4ab3a00b54c2863a436841e00ed',
            '31e15a0dcd6a6c23a879a9d121f400344d4b9fac',
            '5aa96846681bd51441d2cbc5c25a3d5250506ad9',
            'PINNED_SOURCE_HASH_MISMATCH','LIVE_ODATA_SMOKE_FAILED',
            'File]::Replace','PREVIOUS_AGENT_ROLLBACK=PASS',
            'ONE_SHOT_TASK_CLEANUP=PASS','NEW_AGENT_AUTOMATIC_HEARTBEAT=PASS')) {
            if(-not $install.Contains($needle)) {
              throw ('CUTOVER_GUARD_MISSING='+$needle)
            }
          }
          if($install.IndexOf("LIVE_ODATA_SMOKE_FAILED") -gt
             $install.IndexOf("ATOMIC_UPDATE_POLLING_SCRIPT")) {
            throw 'CUTOVER_PROBE_ORDER_UNSAFE'
          }
          $dia=[IO.File]::ReadAllText($diag,[Text.Encoding]::UTF8)
          foreach($needle in @('S-1-5-19','MspOnecNaturalDiagnosticOnce',
            'OPERATING_AGENT_UNCHANGED=YES','25b692b7f4baf63667a6f25462846877371b8dc6',
            'natural-stock-diagnostic-result.txt','SOURCE_HASH_MISMATCH',
            'TEMPORARY_TASK_CLEANUP=PASS')) {
            if(-not $dia.Contains($needle)) {
              throw ('DIAG_STAGE_GUARD_MISSING='+$needle)
            }
          }
          $dh=[IO.File]::ReadAllText($diagHelper,[Text.Encoding]::UTF8)
          foreach($needle in @('S-1-5-19','STAGE=','REASON=','ERROR_TYPE=',
            'RESULT=FAIL','DATA','INVALID_ODATA_PAYLOAD','HTTP_400',
            'natural-stock-diagnostic-result.txt')) {
            if(-not $dh.Contains($needle)) {
              throw ('DIAG_HELPER_GUARD_MISSING='+$needle)
            }
          }
          $v2=[IO.File]::ReadAllText($retry,[Text.Encoding]::UTF8)
          foreach($needle in @('MspOnecHttpsAgentSystem','MspOnecNaturalAcceptanceOnce',
            'JSON_RUNTIME_CLR2_FALLBACK=INSTALLED','PREVIOUS_FAILED_STAGE_NOT_FOUND',
            'PREVIOUS_HELPERS_CHANGED','PREVIOUS_FAILURE_RECEIPT_CHANGED',
            '6a50c09f2a31d0b15891314ae94a3264ce240433',
            '05a3939ed2b8eb28378b395fc8a1b52989b5c3d5',
            '9dcaf6039d6728adb123660df464f356f5e8b3d4',
            '0282d46c2935777a72987c37c1e4533a243a5842',
            'PREVIOUS_NONACTIVE_HELPERS_RESTORED=PASS',
            'PREVIOUS_AGENT_ROLLBACK=PASS','ONE_SHOT_TASK_CLEANUP=PASS',
            'LIVE_ODATA_SMOKE_FAILED','NEW_AGENT_AUTOMATIC_HEARTBEAT=PASS')) {
            if(-not $v2.Contains($needle)) { throw ('RETRY_V2_GUARD_MISSING='+$needle) }
          }
          if($v2.IndexOf("LIVE_ODATA_SMOKE_FAILED") -gt
             $v2.IndexOf("ATOMIC_UPDATE_POLLING_SCRIPT")) {
            throw 'RETRY_V2_PROBE_ORDER_UNSAFE'
          }
          'ONEC_NATURAL_RETRY_V2_STATIC=PASS'
          $legacyJson=[IO.File]::ReadAllText($jsonLibrary,[Text.Encoding]::UTF8)
          foreach($needle in @('MspLegacyJson','DeserializeObject','Serialize',
            'Add-Type -TypeDefinition','JSON duplicate key','JSON depth')) {
            if(-not $legacyJson.Contains($needle)) { throw ('CLR2_JSON_GUARD_MISSING='+$needle) }
          }
          & (Join-Path $PSHOME 'powershell.exe') -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $jsonTests
          if($LASTEXITCODE -ne 0) { throw 'CLR2_JSON_RUNTIME_TEST_FAIL' }
          'CLR2_JSON_RUNTIME_SMOKE=PASS'
          'ONEC_NATURAL_LOCAL_SERVICE_DIAGNOSTIC_STATIC=PASS'
          'ONEC_NATURAL_CUTOVER_PS2_STATIC=PASS'
          'ONEC_NATURAL_PS2_SOURCE_AND_SAFETY=PASS'
          'WINDOWS_2008_R2_NATIVE_RUNTIME=NOT_TESTED'
