name: 1C Windows probe scripts syntax and safety
on:
  pull_request:
    paths:
      - 'scripts/windows/onec-*.ps1'
      - '.github/workflows/onec-srv-windows-source-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/windows/onec-*.ps1'
      - '.github/workflows/onec-srv-windows-source-check.yml'
permissions:
  contents: read
jobs:
  ps-parser:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse on Windows PowerShell 5.1 (not a PS2 native runtime test)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('scripts/windows/onec-probe-poll.ps1','scripts/windows/onec-enroll-token.ps1',
            'scripts/windows/onec-task-preflight.ps1','scripts/windows/onec-task-install.ps1',
            'scripts/windows/onec-task-status.ps1','scripts/windows/onec-task-remove.ps1',
            'scripts/windows/onec-localservice-preflight.ps1',
            'scripts/windows/onec-system-probe-poll.ps1','scripts/windows/onec-system-stage.ps1',
            'scripts/windows/onec-system-task-register.ps1','scripts/windows/onec-system-task-smoke.ps1',
            'scripts/windows/onec-system-cutover.ps1','scripts/windows/onec-system-rollback.ps1',
            'scripts/windows/onec-odata-enroll-readonly.ps1','scripts/windows/onec-system-odata-balance.ps1',
            'scripts/windows/onec-odata-system-upgrade.ps1',
                   'scripts/windows/onec-odata-diagnostic-upgrade.ps1',
            'scripts/windows/onec-odata-error-class-upgrade.ps1',
            'scripts/windows/onec-odata-filter-selfcheck.ps1',
            'scripts/windows/onec-system-odata-pair-check.ps1')
          foreach ($path in $paths) {
            $errors = $null
            $text = [System.IO.File]::ReadAllText($path)
            $null = [System.Management.Automation.PSParser]::Tokenize($text, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              throw ('PARSER_FAILURE=' + $path + ' ' + (($errors | ForEach-Object {$_.Message + '@' + $_.Token.StartLine + ':' + $_.Token.StartColumn}) -join ';'))
            }
            if (-not $text.TrimStart([char]0xFEFF).StartsWith('#requires -version 2')) {
              throw ('VERSION_GUARD_MISSING=' + $path)
            }
          }
          Write-Output 'PS51_SYNTAX_PARSE=PASS'
          Write-Output 'NATIVE_PS2_EXECUTION=NOT_TESTED'
      - name: Enforce read-only probe and private endpoint boundaries
        shell: powershell
        run: |
          $s = [System.IO.File]::ReadAllText('scripts/windows/onec-probe-poll.ps1')
          if ($s -match 'vm-817589|192\.168\.|Invoke-Expression|Invoke-RestMethod|New-PSSession') {
            throw 'PRIVATE_ENDPOINT_OR_UNSAFE_EXECUTION_IN_PUBLIC_SOURCE'
          }
          foreach ($required in @('ConvertTo-SecureString','--tlsv1.2','--cacert','/v1/agent/poll','/v1/agent/result','REPLAY_LEASE_MISMATCH')) {
            if (-not $s.Contains($required)) { throw ('MISSING_GUARD=' + $required) }
          }
          Write-Output 'PROBE_ONLY_CONTRACT=PASS'
      - name: Enforce non-elevated password-logon and fixed target
        shell: powershell
        run: |
          $s = [System.IO.File]::ReadAllText('scripts/windows/onec-task-install.ps1')
          foreach ($required in @('Principal.LogonType=1','Principal.RunLevel=0','RegisterTaskDefinition',
                  "MultipleInstances=2","Repetition.Interval='PT1M'",'Read-Host','-AsSecureString',
                  "taskName='MspOnecHttpsAgentProbe'")) {
            if (-not $s.Contains($required)) { throw ('MISSING_SCHEDULER_GUARD=' + $required) }
          }
          if ($s.Contains('TASK_LOGON_S4U') -or $s.Contains('/RP ') -or $s.Contains('Principal.RunLevel=1')) {
            throw 'UNSAFE_SCHEDULE_MODE'
          }
          Write-Output 'UNATTENDED_TASK_SOURCE_CONTRACT=PASS'
      - name: Guard LocalService read-only preflight
        shell: powershell
        run: |
          $source=[System.IO.File]::ReadAllText('scripts/windows/onec-localservice-preflight.ps1')
          foreach($required in @('S-1-5-19','Schedule.Service','MACHINE_DPAPI_TYPE_AVAILABLE','READ_ONLY=YES','NEXT_GATE=ADMINISTRATIVE_INSTALLATION_REQUIRED')) {
            if (-not $source.Contains($required)) { throw ('PREFLIGHT_GUARD_MISSING='+$required) }
          }
          foreach($denied in @('RegisterTaskDefinition','CreateService','Set-Acl','icacls.exe','ConvertFrom-SecureString','Remove-Item','New-ScheduledTask')) {
            if ($source.Contains($denied)) { throw ('MUTATING_OPERATION_IN_PREFLIGHT='+$denied) }
          }
          Write-Output 'LOCAL_SERVICE_PREFLIGHT_SOURCE=PASS'
      - name: Guard machine-scope token and system staging boundaries
        shell: powershell
        run: |
          $poll=[IO.File]::ReadAllText('scripts/windows/onec-system-probe-poll.ps1')
          $stage=[IO.File]::ReadAllText('scripts/windows/onec-system-stage.ps1')
          foreach($f in @($poll,$stage)) {
            if ($f -match 'vm-817589|192\.168\.|Invoke-Expression|Invoke-RestMethod|New-PSSession') {
              throw 'UNSAFE_HARDCODED_ENDPOINT_OR_REMOTE_EXECUTION'
            }
            if ($f -match 'Get-ChildItem[^\r\n]*\s-File(?:\s|[);])') {
              throw 'UNSUPPORTED_POWERSHELL2_FILE_SWITCH'
            }
          }
          foreach($required in @('S-1-5-19','ProtectedData]::Unprotect','DataProtectionScope]::LocalMachine',
              '/v1/agent/poll','/v1/agent/result','last-status.txt','AUTHENTICATED_EMPTY')) {
            if (-not $poll.Contains($required)) { throw ('SYSTEM_POLL_GUARD_MISSING='+$required) }
          }
          foreach($required in @('ProtectedData]::Protect','DataProtectionScope]::LocalMachine',
              'SYSTEM_STAGE_ALREADY_EXISTS','SYSTEM_CURL_START_FAILED','icacls.exe','SOURCE_SHA256_COPY_VERIFIED',
              'PERSONAL_AGENT_TASK=UNCHANGED','NEW_SYSTEM_TASK=NOT_CREATED','S-1-5-18','S-1-5-32-544','S-1-5-19')) {
            if (-not $stage.Contains($required)) { throw ('SYSTEM_STAGE_GUARD_MISSING='+$required) }
          }
          if ($stage -match 'RegisterTaskDefinition|DeleteTask\(|LegacyTask\.Enabled\s*=') {
            throw 'STAGING_ATTEMPTED_TO_CHANGE_TASK'
          }
          Write-Output 'SYSTEM_AGENT_STAGE_SOURCE_CONTRACT=PASS'
      - name: Guard staging failure reporting: no raw Windows errors or secrets
        shell: powershell
        run: |
          $src=[IO.File]::ReadAllText('scripts/windows/onec-system-stage.ps1')
          foreach($required in @("FAILURE_PHASE=","ERROR_CLASS=","STAGED_ROOT_CLEANUP=",
              "CHECK_SCHEDULER_TASKS","REPROTECT_MACHINE_DPAPI","RESET_BINARY_FILE_ACLS",
              "TEST_COPIED_CURL","'SYSTEM_STAGE_FAILURE'")) {
            if (-not $src.Contains($required)) { throw ('STAGE_FAILURE_DIAGNOSTIC_MISSING='+$required) }
          }
          foreach($banned in @('Write-Output $clear','Write-Output $cipher',
              'Write-Output $_','Write-Output $sealed','Write-Host $_',
              'Write-Output $tokenSource','Write-Output $reason')) {
            if ($src.Contains($banned)) { throw ('UNSAFE_DIAGNOSTIC='+$banned) }
          }
          Write-Output 'STAGING_FAILURE_DIAGNOSTICS=PASS'
      - name: Separate PS2 copy and hash failure phases
        shell: powershell
        run: |
          $src=[IO.File]::ReadAllText('scripts/windows/onec-system-stage.ps1')
          foreach($required in @("COPY_AGENT_SCRIPT","VERIFY_AGENT_SCRIPT_SHA256",
              "VERIFY_CURL_BINARY_SHA256","VERIFY_CA_BUNDLE_SHA256","VERIFY_CURL_DLL_SHA256")) {
            if (-not $src.Contains($required)) { throw ("STAGE_CHECKPOINT_MISSING="+$required) }
          }
          Write-Output "PS2_STAGE_FILE_AND_HASH_CHECKPOINTS=PASS"
      - name: Guard SHA256 cleanup for native PowerShell 2
        shell: powershell
        run: |
          $s=[IO.File]::ReadAllText('scripts/windows/onec-system-stage.ps1')
          if (-not $s.Contains('$sha.Clear()')) { throw 'PS2_SHA256_CLEAR_REQUIRED' }
          if ($s.Contains('$sha.Dispose()')) { throw 'PS2_SHA256_DISPOSE_UNSUPPORTED' }
          $sha=[Security.Cryptography.SHA256]::Create()
          try {
            $bytes=[Text.Encoding]::ASCII.GetBytes('MspOnlyTest')
            $sum=[BitConverter]::ToString($sha.ComputeHash($bytes))
            if (-not $sum) { throw 'SHA256_COMPUTE_FAILED' }
          } finally { $sha.Clear() }
          Write-Output 'PS2_SHA256_CLEANUP_SOURCE=PASS'
      - name: Guard LocalService manual-only task registration
        shell: powershell
        run: |
          $s=[IO.File]::ReadAllText('scripts/windows/onec-system-task-register.ps1')
          $q=[IO.File]::ReadAllText('scripts/windows/onec-system-task-smoke.ps1')
          foreach($required in @('S-1-5-19','Principal.LogonType=5','Principal.RunLevel=0',
              'RegisterTaskDefinition','Repetition.Interval=','trigger.Enabled=$false',
              'OLD_AGENT_ENABLED=YES','SYSTEM_AGENT_EXECUTION=NOT_YET_TESTED',
              'MANUAL_EXECUTION_ALLOWED=YES','AUTOMATIC_TRIGGER_ENABLED=NO',
              'TASK_REGISTERED=YES')) {
            if (-not $s.Contains($required)) { throw ('SYSTEM_SCHEDULER_GUARD_MISSING='+$required) }
          }
          if ($s -match 'Principal.LogonType=1|Settings.Enabled=\$false|Read-Host|Start-Process|Invoke-Expression') {
            throw 'UNSAFE_SYSTEM_SCHEDULER_REGISTRATION'
          }
          foreach($required in @('MANUAL_START=ACCEPTED','AUTOMATIC_TRIGGER_ENABLED=NO',
              'LEGACY_TASK_NOT_ENABLED','LOCAL_SERVICE_HEALTH=','last-status.txt',
              'SYSTEM_TASK_RUNTIME=PASS')) {
            if (-not $q.Contains($required)) { throw ('SYSTEM_SMOKE_GUARD_MISSING='+$required) }
          }
          if ($q -match 'RegisterTaskDefinition|\.Enabled\s*=\s*\$true|DeleteTask\(|Disable-ScheduledTask') {
            throw 'UNEXPECTED_SCHEDULE_MUTATION_IN_SMOKE'
          }
          Write-Output 'SYSTEM_TASK_MANUAL_ONLY=PASS'
      - name: Guard bounded LocalService cutover and rollback safety
        shell: powershell
        run: |
          $cut=[IO.File]::ReadAllText('scripts/windows/onec-system-cutover.ps1')
          $back=[IO.File]::ReadAllText('scripts/windows/onec-system-rollback.ps1')
          foreach($required in @('S-1-5-19','SID','RegisterTaskDefinition','Start-Sleep',
            'PERSONAL_AGENT_RESTORE=PASS','SYSTEM_TIMER_DISARM=PASS',
            'SYSTEM_SCHEDULED_HEARTBEAT=PASS','GITHUB_ROUNDTRIP=NOT_YET_TESTED',
            'PERSONAL_AGENT_DISABLED=YES','newChangeAttempted',
            'SCHEDULED_SYSTEM_HEARTBEAT_TIMEOUT','FAILURE_PHASE=')) {
            if (-not $cut.Contains($required) -and $required -ne 'SID') {
              throw ('CUTOVER_GUARD_MISSING='+$required)
            }
          }
          if (-not $cut.Contains('for($i=1;$i -le 75;$i++)')) { throw 'CUTOVER_TIMEOUT_MISSING' }
          if ($cut.IndexOf('PERSONAL_AGENT_RESTORE=PASS') -gt $cut.IndexOf('SYSTEM_TIMER_DISARM=PASS')) {
            throw 'CUTOVER_WRONG_ROLLBACK_ORDER'
          }
          foreach($required in @('PERSONAL_AGENT_RESTORE=PASS','SYSTEM_TIMER_DISARM=PASS',
            'RegisterTaskDefinition','RESULT=PASS;STAGE=ROLLBACK_TO_PERSONAL_AGENT')) {
            if (-not $back.Contains($required)) { throw ('BACKOUT_GUARD_MISSING='+$required) }
          }
          foreach($code in @($cut,$back)) {
            if ($code -match 'vm-817589|192\.168\.|Invoke-Expression|New-PSSession|Read-Host') {
              throw 'UNSAFE_CUTOVER_CODE'
            }
          }
          Write-Output 'BOUNDED_CUTOVER_AND_ROLLBACK_SOURCE=PASS'

      - name: Guard fixed GET-only sandbox OData and local credential enrollment
        shell: powershell
        run: |
          $balance=[IO.File]::ReadAllText('scripts/windows/onec-system-odata-balance.ps1')
          $enroll=[IO.File]::ReadAllText('scripts/windows/onec-odata-enroll-readonly.ps1')
          $agent=[IO.File]::ReadAllText('scripts/windows/onec-system-probe-poll.ps1')
          foreach($required in @('S-1-5-19',"request.Method='GET'",'AllowAutoRedirect=$false',
              "Proxy=$null",'127.0.0.1:8085/NewBase/odata/standard.odata/',
              'STOCK_Q_','32768','ProtectedData]::Unprotect','DataProtectionScope]::LocalMachine')) {
            if (-not $balance.Contains($required)) { throw ('ODATA_BALANCE_GUARD_MISSING='+$required) }
          }
          foreach($required in @('Read-Host','-AsSecureString','MCP_OData_ReadOnly','ProtectedData]::Protect',
              'DataProtectionScope]::LocalMachine','S-1-5-19','PASSWORD_EXPORTED=NO')) {
            if (-not $enroll.Contains($required)) { throw ('ODATA_ENROLL_GUARD_MISSING='+$required) }
          }
          foreach($required in @('odata_balance','onec-system-odata-balance.ps1','REPLAY_LEASE_MISMATCH')) {
            if (-not $agent.Contains($required)) { throw ('ODATA_AGENT_GUARD_MISSING='+$required) }
          }
          foreach($src in @($balance,$enroll)) {
            if ($src -match 'Invoke-Expression|Invoke-RestMethod|New-PSSession|192\.168\.|vm-817589') {
              throw 'ODATA_UNSAFE_REMOTE_CODE'
            }
          }
          Write-Output 'ODATA_READONLY_SOURCE_CONTRACT=PASS'
